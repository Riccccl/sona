name: SONA CI Workflow

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore cached studies
        uses: actions/cache/restore@v4
        with:
          path: cached_studies.json
          key: cached-studies-${{ github.run_id }}
          restore-keys: |
            cached-studies-

      - name: Ensure cache file exists
        run: |
          if [ ! -f cached_studies.json ]; then
            echo "[]" > cached_studies.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps --only-shell chromium

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SONA_USERNAME: ${{ secrets.SONA_USERNAME }}
          SONA_PASSWORD: ${{ secrets.SONA_PASSWORD }}
        run: |
          python main.py

      - name: Save updated cache
        uses: actions/cache/save@v4
        with:
          path: cached_studies.json
          key: cached-studies-${{ github.run_id }}