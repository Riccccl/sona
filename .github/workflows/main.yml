name: SONA CI Workflow

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached studies
        uses: actions/cache/restore@v4
        with:
          path: cached_studies.json
          key: cached-studies-${{ github.run_id }}
          restore-keys: cached-studies-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps --only-shell

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SONA_USERNAME: ${{ secrets.SONA_USERNAME }}
          SONA_PASSWORD: ${{ secrets.SONA_PASSWORD }}
        run: python main.py

      - name: Delete old caches
        run: |
          gh cache list --key "cached-studies-" --json id --jq '.[].id' | \
          xargs -r -I {} gh cache delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Save cached studies
        uses: actions/cache/save@v4
        with:
          path: cached_studies.json
          key: cached-studies-${{ github.run_id }}
